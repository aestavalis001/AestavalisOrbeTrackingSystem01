name: OrbeStation Telegram Monitor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: orbestation-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Install Facebook CLI
        run: |
          go install github.com/tamnd/facebook-cli/cmd/fb@v0.3.0

      - name: Check OrbeStation for new posts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail

          echo "Checking Orbe Station anonymously..."
          echo "No Facebook account, cookies, or credentials are being used."
          echo ""

          "$(go env GOPATH)/bin/fb" feed OrbeStation -n 5 -o jsonl > feed.jsonl

          echo "Facebook CLI completed successfully."
          echo ""

          python - <<'PY'
          import json

          records = []

          with open("feed.jsonl", "r", encoding="utf-8") as f:
              for line in f:
                  line = line.strip()

                  if line:
                      try:
                          records.append(json.loads(line))
                      except json.JSONDecodeError:
                          pass

          posts = []

          for record in records:
              if not isinstance(record, dict):
                  continue

              if record.get("posts"):
                  candidate_posts = record["posts"]

                  if isinstance(candidate_posts, list):
                      posts.extend(candidate_posts)

              elif record.get("id") and (
                  record.get("message")
                  or record.get("created_at")
                  or record.get("url")
              ):
                  posts.append(record)

          if not posts:
              raise RuntimeError(
                  "Facebook CLI returned successfully, but no posts could be parsed."
              )

          unique = {}

          for post in posts:
              post_id = str(post.get("id", "")).strip()

              if post_id:
                  unique[post_id] = post

          posts = list(unique.values())

          posts.sort(
              key=lambda post: post.get("created_at", ""),
              reverse=True
          )

          latest = posts[0]

          latest_id = str(latest["id"])

          if isinstance(latest.get("message"), dict):
              latest_text = latest["message"].get("text", "")
          else:
              latest_text = str(latest.get("message", ""))

          latest_text = latest_text.strip()
          latest_url = latest.get("url", "")
          latest_created = latest.get("created_at", "")

          print("Latest post ID:", latest_id)
          print("Latest post date:", latest_created)
          print("Latest post URL:", latest_url)
          print("Latest post text:")
          print(latest_text)
          print("")

          with open("latest.env", "w", encoding="utf-8") as f:
              f.write(f"LATEST_ID={latest_id}\n")
              f.write(f"LATEST_URL={latest_url}\n")
              f.write(f"LATEST_CREATED={latest_created}\n")

          with open("latest_text.txt", "w", encoding="utf-8") as f:
              f.write(latest_text)
          PY

          source latest.env
          LATEST_TEXT="$(cat latest_text.txt)"

          mkdir -p state

          if [ ! -f state/last_post_id.txt ]; then
            echo "No previous post state exists."
            echo "Initializing with the current latest post."
            echo "No Telegram alert will be sent on this first run."

            echo "$LATEST_ID" > state/last_post_id.txt

          else
            LAST_ID="$(cat state/last_post_id.txt)"

            echo "Previously recorded post ID: $LAST_ID"
            echo "Current latest post ID:       $LATEST_ID"
            echo ""

            if [ "$LATEST_ID" = "$LAST_ID" ]; then
              echo "No new post."
              echo "Nothing to send."

            else
              echo "NEW ORBE STATION POST DETECTED!"
              echo ""

              MESSAGE=$(printf \
                '🚨 Orbe Station — NEW POST\n\n%s\n\n%s' \
                "$LATEST_TEXT" \
                "$LATEST_URL"
              )

              curl \
                --fail \
                --silent \
                --show-error \
                -X POST \
                "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
                --data-urlencode "text=${MESSAGE}"

              echo "Telegram alert sent."

              echo "$LATEST_ID" > state/last_post_id.txt
            fi
          fi

          git add state/last_post_id.txt

          if ! git diff --cached --quiet -- state/last_post_id.txt; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git commit -m "Update OrbeStation monitor state"
            git push
          fi
