name: Test Anonymous Facebook CLI

on:
  workflow_dispatch:

jobs:
  test-facebook-cli:
    runs-on: ubuntu-24.04

    steps:
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Install Facebook CLI
        run: |
          go install github.com/tamnd/facebook-cli/cmd/fb@v0.3.0

      - name: Check Facebook CLI
        run: |
          "$(go env GOPATH)/bin/fb" version
          echo ""
          echo "Facebook CLI installed successfully."
          echo "No Facebook account, cookies, or credentials are being used."

      - name: Test anonymous OrbeStation access
        run: |
          echo "Testing anonymous Facebook access..."
          echo ""

          "$(go env GOPATH)/bin/fb" page OrbeStation --posts -n 5 -o jsonl
