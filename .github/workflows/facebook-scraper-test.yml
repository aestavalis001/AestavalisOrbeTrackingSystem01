name: Test Facebook Scraper

on:
  workflow_dispatch:

jobs:
  test-scraper:
    runs-on: ubuntu-24.04

    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install chromium

      - name: Test Facebook access methods
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright

          urls = [
              "https://mbasic.facebook.com/OrbeStation/",
              "https://m.facebook.com/OrbeStation/",
              "https://www.facebook.com/OrbeStation/",
              "https://www.facebook.com/pg/OrbeStation/posts/"
          ]

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)

              for url in urls:
                  print("\n" + "=" * 80)
                  print("TESTING:", url)
                  print("=" * 80)

                  page = browser.new_page(
                      user_agent=(
                          "Mozilla/5.0 (Linux; Android 10; K) "
                          "AppleWebKit/537.36 (KHTML, like Gecko) "
                          "Chrome/131.0.0.0 Mobile Safari/537.36"
                      )
                  )

                  try:
                      response = page.goto(
                          url,
                          wait_until="domcontentloaded",
                          timeout=60000
                      )

                      page.wait_for_timeout(3000)

                      print("STATUS:", response.status if response else "NO RESPONSE")
                      print("FINAL URL:", page.url)
                      print("TITLE:", page.title())

                      text = page.locator("body").inner_text(timeout=30000)

                      print("PAGE TEXT:")
                      print(text[:4000])

                  except Exception as e:
                      print("ERROR:", repr(e))

                  finally:
                      page.close()

              browser.close()
          PY
